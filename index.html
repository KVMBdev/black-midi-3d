<script>
class NoteBuffer {
    constructor(capacity = 840000) {
        this.capacity = capacity;
        this.length = 0;
        this.startTick = new Int32Array(capacity);
        this.durationTrack = new Uint32Array(capacity);
        this.packedInfo = new Uint32Array(capacity);
    }
    push(p, v, ch, tr, pr, b, sT, eT) {
        if (this.length >= this.capacity) {
            this.capacity = Math.floor(this.capacity * 1.5);
            const resize = (arr, T) => { const n = new T(this.capacity); n.set(arr); return n; };
            this.startTick = resize(this.startTick, Int32Array);
            this.durationTrack = resize(this.durationTrack, Uint32Array);
            this.packedInfo = resize(this.packedInfo, Uint32Array);
        }
        let i = this.length++;
        this.startTick[i] = sT;
        let dur = Math.max(1, eT - sT);
        dur = Math.min(dur, 0b11111111111111111111);
        let tk = Math.min(tr, 0b111111111111);
        this.durationTrack[i] = dur | (tk << 20);
        this.packedInfo[i] = (p & 0b01111111) | ((v & 0b01111111) << 7) | ((ch & 0b00001111) << 14) | ((pr & 0b01111111) << 18) | ((b & 0b01111111) << 25);
    }
    getPitch(i) { return this.packedInfo[i] & 0b01111111; }
    getVelocity(i) { return (this.packedInfo[i] >>> 7) & 0b01111111; }
    getChannel(i) { return (this.packedInfo[i] >>> 14) & 0b00001111; }
    getProgram(i) { return (this.packedInfo[i] >>> 18) & 0b01111111; }
    getBank(i) { return (this.packedInfo[i] >>> 25) & 0b01111111; }
    getDuration(i) { return this.durationTrack[i] & 0b11111111111111111111; }
    getTrack(i) { return (this.durationTrack[i] >>> 20) & 0b111111111111; }
    getEndTick(i) { return this.startTick[i] + (this.durationTrack[i] & 0b11111111111111111111); }

    packAndSort() {
        this.inPlaceSort(0, this.length - 1);
        return this;
    }

    inPlaceSort(left, right) {
        if (left >= right) return;
        let pivot = this.startTick[(left + right) >> 1];
        let i = left, j = right;
        while (i <= j) {
            while (this.startTick[i] < pivot) i++;
            while (this.startTick[j] > pivot) j--;
            if (i <= j) {
                let tempST = this.startTick[i]; this.startTick[i] = this.startTick[j]; this.startTick[j] = tempST;
                let tempDT = this.durationTrack[i]; this.durationTrack[i] = this.durationTrack[j]; this.durationTrack[j] = tempDT;
                let tempPI = this.packedInfo[i]; this.packedInfo[i] = this.packedInfo[j]; this.packedInfo[j] = tempPI;
                i++; j--;
            }
        }
        this.inPlaceSort(left, j);
        this.inPlaceSort(i, right);
    }
}
class LightweightMIDIParser {
  constructor() {
    this.notes = new NoteBuffer(0);
    this.parsedTempos = [];
    this.activeTempos = [];
    this.durMs = 0;
    this.tracksCount = 0;
    this.ppq = 1080;
    this.channelEvents = Array.from({length: 16}, () => ({ pb: [], vol: [], pan: [], expr: [], mod: [] }));
    this.noteStartMs = null;
    this.noteEndMs = null;
  }
  tickToMs(tick) {
      let left = 0, right = this.activeTempos.length - 1, ans = 0;
      while(left <= right) {
          let mid = (left + right) >> 1;
          if(this.activeTempos[mid].tick <= tick) { ans = mid; left = mid + 1; }
          else { right = mid - 1; }
      }
      let t = this.activeTempos[ans];
      return t.ms + ((tick - t.tick) * (t.tempo / 1000)) / this.ppq;
  }
  msToTick(ms) {
      let left = 0, right = this.activeTempos.length - 1, ans = 0;
      while(left <= right) {
          let mid = (left + right) >> 1;
          if(this.activeTempos[mid].ms <= ms) { ans = mid; left = mid + 1; }
          else { right = mid - 1; }
      }
      let t = this.activeTempos[ans];
      return t.tick + ((ms - t.ms) * this.ppq) / (t.tempo / 1000);
  }
  
  async parse(buffer, onProgress) {
    let view = new DataView(buffer);
    let bytes = new Uint8Array(buffer); 
    
    if (view.getUint32(0) !== 0b01001101010101000110100001100100) throw new Error("Not a valid MIDI file.");
    this.ppq = view.getUint16(12);
    this.tracksCount = view.getUint16(10);
    
    let estimatedSize = Math.max(2097152, Math.floor(buffer.byteLength / 3)); 
    this.notes = new NoteBuffer(estimatedSize);
    
    this.parsedTempos = [];
    this.channelEvents = Array.from({length: 16}, () => ({ pb: [], vol: [], pan: [], expr: [], mod: [] }));
    let offset = 14;
    let notesPushed = 0;
    let chunkCounter = 0;
    const CHUNK_SIZE = 2097152;
    let programs = new Uint8Array(16);
    let banks = new Uint8Array(16); 
    let sustainPedal = new Uint8Array(16);
    
    for (let t = 0; t < this.tracksCount; t++) {
      if (offset >= buffer.byteLength) break;
      if (view.getUint32(offset) !== 0b01001101010101000111001001101011) { offset += 8 + view.getUint32(offset + 4); continue; }
      const trackLen = view.getUint32(offset + 4);
      let trackOffset = offset + 8;
      const trackEnd = trackOffset + trackLen;
      let currentTicks = 0;
      let activeStart = new Int32Array(2048);
      let activeVel = new Uint8Array(2048);
      let activeChan = new Uint8Array(2048);
      let activeTrack = new Uint16Array(2048);
      let activeState = new Uint8Array(2048); 
      let lastStatus = 0;
      
      while (trackOffset < trackEnd) {
        let deltaTime = 0;
        while (true) {
          let byte = bytes[trackOffset++];
          deltaTime = (deltaTime << 7) | (byte & 0b01111111);
          if (!(byte & 0b10000000)) break;
        }
        currentTicks += deltaTime;
        let status = bytes[trackOffset];
        if (status < 0b10000000) { status = lastStatus; } else { lastStatus = status; trackOffset++; }
        
        if (status === 0b11111111) {
          let metaType = bytes[trackOffset++];
          let metaLen = 0;
          while (true) { let byte = bytes[trackOffset++]; metaLen = (metaLen << 7) | (byte & 0b01111111); if (!(byte & 0b10000000)) break; }
          if (metaType === 0b01010001 && metaLen === 3) {
             let tempoUs = (bytes[trackOffset] << 16) | (bytes[trackOffset+1] << 8) | bytes[trackOffset+2];
             this.parsedTempos.push({tick: currentTicks, tempo: tempoUs});
          }
          trackOffset += metaLen;
        } else if (status === 0b11110000 || status === 0b11110111) {
          let len = 0;
          while (true) { let byte = bytes[trackOffset++]; len = (len << 7) | (byte & 0b01111111); if (!(byte & 0b10000000)) break; }
          trackOffset += len;
        } else {
          let msgType = status & 0b11110000;
          let channel = status & 0b00001111;
          if (msgType === 0b10010000 || msgType === 0b10000000) {
            let pitch = bytes[trackOffset++];
            let velocity = bytes[trackOffset++];
            let key = (channel << 7) | pitch;
            if (msgType === 0b10010000 && velocity > 0) {
              if (activeState[key] !== 0) {
                this.notes.push(pitch, activeVel[key], activeChan[key], activeTrack[key], programs[channel], banks[channel], activeStart[key], currentTicks);
                notesPushed++; chunkCounter++;
              }
              activeStart[key] = currentTicks; activeVel[key] = velocity; activeChan[key] = channel; activeTrack[key] = t; activeState[key] = 1;
            } else {
              if (activeState[key] === 1) {
                if (sustainPedal[channel]) { 
                    activeState[key] = 2;
                } else {
                    this.notes.push(pitch, activeVel[key], activeChan[key], activeTrack[key], programs[channel], banks[channel], activeStart[key], currentTicks);
                    activeState[key] = 0;
                    notesPushed++; chunkCounter++;
                }
              }
            }
          } else if (msgType === 0b11000000) {
            programs[channel] = bytes[trackOffset++];
          } else if (msgType === 0b10110000) {
            let cc = bytes[trackOffset++]; let val = bytes[trackOffset++];
            if (cc === 0 || (cc === 32 && banks[channel] === 0)) { banks[channel] = val; } 
            else if (cc === 1) { this.channelEvents[channel].mod.push({tick: currentTicks, val}); }
            else if (cc === 7) { this.channelEvents[channel].vol.push({tick: currentTicks, val}); }
            else if (cc === 10) { this.channelEvents[channel].pan.push({tick: currentTicks, val}); }
            else if (cc === 11) { this.channelEvents[channel].expr.push({tick: currentTicks, val}); }
            else if (cc === 64) {
                let isSustain = val >= 64; 
                sustainPedal[channel] = isSustain;
                if (!isSustain) {
                    for (let i = 0; i < 2048; i++) {
                        if (activeState[i] === 2 && (i >> 7) === channel) {
                            this.notes.push(i & 0b01111111, activeVel[i], channel, activeTrack[i], programs[channel], banks[channel], activeStart[i], currentTicks);
                            activeState[i] = 0;
                            notesPushed++; chunkCounter++;
                        }
                    }
                }
            }
          } else if (msgType === 0b11100000) {
              let lsb = bytes[trackOffset++]; let msb = bytes[trackOffset++];
              this.channelEvents[channel].pb.push({tick: currentTicks, val: ((msb << 7) | lsb) - 8192});
          } else if (msgType === 0b10100000) { trackOffset += 2; } 
            else if (msgType === 0b11010000) { trackOffset += 1; }
        }
        if (chunkCounter >= CHUNK_SIZE) { 
            chunkCounter = 0; 
            if (onProgress) onProgress(notesPushed, "Parsing Notes"); 
            await new Promise(resolve => setTimeout(resolve, 0)); 
        }
      }
      for (let i = 0; i < 2048; i++) {
        if (activeState[i] !== 0 && activeTrack[i] === t) {
          this.notes.push(i & 0b01111111, activeVel[i], activeChan[i], activeTrack[i], programs[activeChan[i]], banks[activeChan[i]], activeStart[i], currentTicks);
          activeState[i] = 0;
          notesPushed++;
        }
      }
      offset += 8 + trackLen;
    }
    bytes = null; view = null;
    if (onProgress) onProgress(notesPushed, "Compiling Blob");
    await new Promise(resolve => setTimeout(resolve, 0));
    
    this.notes.packAndSort(); 
    this.parsedTempos.sort((a, b) => a.tick - b.tick);
    await this.recalculateTimings(null, onProgress);
  }
  async recalculateTimings(overrideSeconds = null, onProgress = null) {
    this.durMs = 0;
    let activeTempos = [];
    let curMs = 0, curTick = 0, curTempo = 500000;
    for (let t of this.parsedTempos) {
        if (t.tick > curTick) { curMs += ((t.tick - curTick) * (curTempo / 1000)) / this.ppq; curTick = t.tick; }
        curTempo = t.tempo;
        if (activeTempos.length > 0 && activeTempos[activeTempos.length - 1].tick === t.tick) activeTempos[activeTempos.length-1].tempo = curTempo;
        else activeTempos.push({tick: curTick, tempo: curTempo, ms: curMs});
    }
    if (!activeTempos.length || activeTempos[0].tick !== 0) activeTempos.unshift({tick: 0, tempo: 500000, ms: 0});
    this.activeTempos = activeTempos; 
    
    for (let ch = 0; ch < 16; ch++) {
        ['pb', 'vol', 'pan', 'expr', 'mod'].forEach(type => {
            for (let ev of this.channelEvents[ch][type]) { ev.ms = this.tickToMs(ev.tick); }
        });
    }
    if (onProgress) onProgress(this.notes.length, "Calculating Timings");
    await new Promise(resolve => setTimeout(resolve, 0));
    
    let maxETick = 0;
    for (let i = 0; i < this.notes.length; i++) {
        if (this.notes.getEndTick(i) > maxETick) maxETick = this.notes.getEndTick(i);
    }
    this.durMs = this.tickToMs(maxETick);

    // Cache note times in Float32Array to eliminate per-frame search/calculation overhead
    this.noteStartMs = new Float32Array(this.notes.length);
    this.noteEndMs = new Float32Array(this.notes.length);
    for (let i = 0; i < this.notes.length; i++) {
        this.noteStartMs[i] = this.tickToMs(this.notes.startTick[i]);
        this.noteEndMs[i] = this.tickToMs(this.notes.getEndTick(i));
    }
  }
}
class CompactSF2Parser {
  constructor() { this.reset(); }
  reset() {
    this.buffer = null; this.isLoaded = false;
    this.sampleCache = new Map();
    this.keyMap = new Map();

  async load(file) {
    this.reset();
    this.buffer = await file.arrayBuffer();
    this.isLoaded = true;

};
bindSlider('pxRatioSlider', 'pxRatioVal');
bindSlider('zSlider', 'zVal', 'x');
bindSlider('dSlider', 'dVal', 's');
bindSlider('chunkSlider', 'chunkVal', 's');
bindSlider('polySlider', 'polyVal');
bindSlider('maxInstSlider', 'maxInstVal');

document.getElementById('loadSf2Btn').addEventListener('click', () => document.getElementById('sf2Input').click());
document.getElementById('sf2Input').addEventListener('change', async (e) => {
    if (e.target.files.length) {
        document.getElementById('sf2Label').innerText = "LOADING...";
        await sf2Parser.load(e.target.files[0]);
        document.getElementById('sf2Label').innerText = "SF2 LOADED";
        if (parser.notes && parser.notes.length > 0) await sf2Parser.preloadUsedSamples(parser.notes);
    }
});

async function handleFile(file) {
  if (!file) return;
  const playBtn = document.getElementById('startPlayBtn');
  playBtn.innerText = "PARSING MIDI..."; playBtn.disabled = true;
  try {
    const arrayBuffer = await file.arrayBuffer(); 
    await parser.parse(arrayBuffer, (count) => { 
      document.getElementById('sN').innerText = `${count.toLocaleString()} / 0`;
    });   
    document.getElementById('sT').innerText = parser.tracksCount;
    document.getElementById('sB').innerText = parser.parsedTempos.length > 0 ? Math.round(60000000 / parser.parsedTempos[0].tempo) : 120;
    document.getElementById('sD').innerText = `0:00 / ${formatTime(parser.durMs)}`;
    if (sf2Parser.isLoaded) await sf2Parser.preloadUsedSamples(parser.notes);
    audioEngine.init(parser);
    viz.loadMIDI(parser);
    document.getElementById('fileInput').value = '';
    playBtn.innerHTML = '<i class="fas fa-play"></i> START PLAY';
    playBtn.disabled = false;
  } catch(e) {
    alert("Error parsing MIDI: " + e.message);
    playBtn.innerHTML = '<i class="fas fa-play"></i> START PLAY';
  }
}

document.getElementById('loadBtn').addEventListener('click', () => document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change', (e) => handleFile(e.target.files[0]));
const dropZone = document.getElementById('uiScreen');
dropZone.addEventListener('dragover', (e) => e.preventDefault());
dropZone.addEventListener('drop', (e) => { e.preventDefault(); if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });

document.getElementById('startPlayBtn').addEventListener('click', () => {
  if(!viz.parser) return;
  viz.renderer.setPixelRatio(parseFloat(document.getElementById('pxRatioSlider').value));
  viz.zSpeed = parseFloat(document.getElementById('zSlider').value);
  viz.renderDistSeconds = parseInt(document.getElementById('dSlider').value);
  audioEngine.chunkSize = parseFloat(document.getElementById('chunkSlider').value);
  audioEngine.maxVoices = parseInt(document.getElementById('polySlider').value);
  viz.updateMaxInstances(parseInt(document.getElementById('maxInstSlider').value));
  document.getElementById('uiScreen').classList.remove('active');
  document.getElementById('playScreen').classList.add('active');
  viz.onWindowResize(); 
  
  const startBPM = parser.parsedTempos.length > 0 ? 120 : 120;
  viz.curMs = -((60000 / startBPM) * 0);
  viz.isPlaying = true;
  viz.cachedStartIdx = 0;
  viz.lastAssignedNotes.fill(-1);

  // Pre-load / buffer initial audio chunks immediately during pre-roll
  if (sf2Parser.isLoaded) {
      audioEngine.play(0);
  }

  if (!viz.lastTime) requestAnimationFrame(viz.renderFrame.bind(viz));
});
document.getElementById('exitBtn').addEventListener('click', () => {
  viz.isPlaying = false;
  audioEngine.stop();
  document.getElementById('playScreen').classList.remove('active');
  document.getElementById('uiScreen').classList.add('active');
});
</script>

</body></html>
